name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runs-on: ${{ steps.runner.outputs.runs-on }}
    steps:
      - name: Prefer Mac self-hosted runner
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REPOSITORY" != "$REPO" ]]; then
            echo 'runs-on="macos-latest"' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runner_json="$(gh api "repos/${REPO}/actions/runners?per_page=100" 2>/dev/null || true)"
          if [[ -n "$runner_json" ]] && jq -e '.runners[]? | select(.name == "Mac" and .status == "online" and .busy == false)' >/dev/null 2>&1 <<< "$runner_json"; then
            echo 'runs-on=["self-hosted","macOS","X64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runs-on="macos-latest"' >> "$GITHUB_OUTPUT"
          fi

  dotnet:
    name: dotnet
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore ./SyncFactors.Next.sln

      - name: Build solution
        run: dotnet build ./SyncFactors.Next.sln --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: ./src/SyncFactors.Api
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        working-directory: ./src/SyncFactors.Api
        run: npm run test:ui

      - name: Build frontend bundles
        working-directory: ./src/SyncFactors.Api
        run: npm run build:ui

      - name: Run .NET test suite
        run: dotnet test ./SyncFactors.Next.sln --configuration Release --no-build --settings ./coverlet.runsettings --logger "trx;LogFileName=test-results.trx" --results-directory ./artifacts/test-results

      - name: Run lifecycle simulation master suite
        run: dotnet test ./tests/SyncFactors.MockSuccessFactors.Tests/SyncFactors.MockSuccessFactors.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~RunAsync_CheckedInSimulationMasterSuite_CoversAllCheckedInScenarios" --logger "trx;LogFileName=lifecycle-simulation-master-results.trx" --results-directory ./artifacts/test-results

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX --version 5.5.0

      - name: Generate SBOM
        run: ~/.dotnet/tools/dotnet-CycloneDX ./SyncFactors.Next.sln --output ./artifacts/sbom --json

      - name: Attest SBOM build provenance
        if: hashFiles('artifacts/sbom/*') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/sbom/*

      - name: Upload SBOM
        if: always() && hashFiles('artifacts/sbom/*') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom/*

      - name: Upload .NET test results
        if: always() && hashFiles('artifacts/test-results/*.trx') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: artifacts/test-results/*.trx
