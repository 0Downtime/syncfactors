name: Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull request from GitHub API
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$EVENT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "The pull request event did not contain a valid pull request number."
            exit 0
          fi

          pr_json="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPO}/pulls/${EVENT_PR_NUMBER}")"
          eligible="$(jq -r --arg repo "$REPO" '
            (.base.ref == "main") and
            (.state == "open") and
            (.draft == false) and
            (.head.repo.fork == false) and
            (.head.repo.full_name == $repo) and
            ((.user.login == "dependabot[bot]") or ([.labels[]?.name] | index("automerge:approved") != null))
          ' <<< "$pr_json")"

          if [[ "$eligible" != "true" ]]; then
            echo "Pull request is not eligible for automatic merge."
            exit 0
          fi

          pr_number="$(jq -r '.number // empty' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ || ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The GitHub API returned incomplete pull request provenance."
            exit 1
          fi

          {
            echo 'eligible=true'
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Enable GitHub auto-merge for the pull request
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: gh pr merge --auto --merge --match-head-commit "$PR_HEAD_SHA" --repo "$REPO" "$PR_NUMBER"
