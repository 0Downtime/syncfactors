name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runs-on: ${{ steps.runner.outputs.runs-on }}
    steps:
      - name: Prefer Mac self-hosted runner
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          runner_json="$(gh api "repos/${REPO}/actions/runners?per_page=100" 2>/dev/null || true)"
          if [[ -n "$runner_json" ]] && jq -e '.runners[]? | select(.name == "Mac" and .status == "online" and .busy == false)' >/dev/null 2>&1 <<< "$runner_json"; then
            echo 'runs-on=["self-hosted","macOS"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runs-on="macos-latest"' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Detect .NET architecture
        if: ${{ matrix.build-mode == 'manual' }}
        id: dotnet_arch
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64|aarch64)
              echo "architecture=arm64" >> "$GITHUB_OUTPUT"
              ;;
            x86_64|amd64)
              echo "architecture=x64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported machine architecture: $(uname -m)"
              exit 1
              ;;
          esac

      - name: Set up .NET SDK
        if: ${{ matrix.build-mode == 'manual' }}
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 10.0.x
          architecture: ${{ steps.dotnet_arch.outputs.architecture }}

      - name: Build solution
        if: ${{ matrix.build-mode == 'manual' }}
        run: dotnet build ./SyncFactors.Next.sln --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          category: /language:${{ matrix.language }}
