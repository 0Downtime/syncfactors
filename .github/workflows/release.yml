name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable SemVer override. Must match 0.1.<commit-count> at the target ref.
        required: false
        type: string
      target_ref:
        description: Branch, tag, or commit SHA to release.
        required: false
        default: main
        type: string

permissions:
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SYNCFACTORS_RELEASE_RUNTIME: win-x64

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runs-on: ${{ steps.runner.outputs.runs-on }}
    steps:
      - name: Prefer Mac self-hosted runner
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          runner_json="$(gh api "repos/${REPO}/actions/runners?per_page=100" 2>/dev/null || true)"
          if [[ -n "$runner_json" ]] && jq -e '.runners[]? | select(.name == "Mac" and .status == "online" and .busy == false)' >/dev/null 2>&1 <<< "$runner_json"; then
            echo 'runs-on=["self-hosted","macOS","X64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runs-on="macos-latest"' >> "$GITHUB_OUTPUT"
          fi

  verify-required-ci-checks:
    name: Verify required CI checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target_ref || github.sha }}

      - name: Wait for required CI checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        shell: pwsh
        run: |
          $requiredChecks = @(
              [PSCustomObject]@{ checkName = 'dotnet'; workflowFile = 'test.yml'; jobName = 'dotnet' },
              [PSCustomObject]@{ checkName = 'GitHub Workflow Security Policy'; workflowFile = 'security.yml'; jobName = 'GitHub Workflow Security Policy' },
              [PSCustomObject]@{ checkName = 'Semgrep Security SAST'; workflowFile = 'security.yml'; jobName = 'Semgrep Security SAST' },
              [PSCustomObject]@{ checkName = 'Gitleaks Secret Scan'; workflowFile = 'security.yml'; jobName = 'Gitleaks Secret Scan' },
              [PSCustomObject]@{ checkName = 'Trivy Repository Scan'; workflowFile = 'security.yml'; jobName = 'Trivy Repository Scan' },
              [PSCustomObject]@{ checkName = 'Analyze (csharp, none)'; workflowFile = 'codeql.yml'; jobName = 'Analyze (csharp, none)' },
              [PSCustomObject]@{ checkName = 'Analyze (javascript-typescript, none)'; workflowFile = 'codeql.yml'; jobName = 'Analyze (javascript-typescript, none)' }
          )
          $releaseCommitSha = (git rev-parse HEAD).Trim()
          $deadline = (Get-Date).AddMinutes(30)
          $workflowIds = @{}
          foreach ($workflowFile in ($requiredChecks.workflowFile | Select-Object -Unique)) {
              $workflow = gh api "repos/$env:GITHUB_REPOSITORY_NAME/actions/workflows/$workflowFile" | ConvertFrom-Json -Depth 20
              $workflowIds[$workflowFile] = [Int64]$workflow.id
          }
          $detailsUrlPattern = "^https://github\.com/$([regex]::Escape($env:GITHUB_REPOSITORY_NAME))/actions/runs/(?<runId>\d+)/job/(?<jobId>\d+)$"

          do {
              $response = gh api "repos/$env:GITHUB_REPOSITORY_NAME/commits/$releaseCommitSha/check-runs?per_page=100" | ConvertFrom-Json -Depth 20
              $incompleteChecks = @()
              $failedChecks = @()
              $untrustedSameName = @{}
              foreach ($requiredCheck in $requiredChecks) {
                  $matchingChecks = @($response.check_runs | Where-Object { $_.name -eq $requiredCheck.checkName } | Sort-Object started_at -Descending)
                  if ($matchingChecks.Count -eq 0) {
                      $incompleteChecks += "$($requiredCheck.checkName)=missing"
                      continue
                  }

                  $trustedCheck = $null
                  foreach ($check in $matchingChecks) {
                      if ($check.app.slug -ne 'github-actions' -or $check.details_url -notmatch $detailsUrlPattern) {
                          continue
                      }

                      $detailsMatch = [regex]::Match($check.details_url, $detailsUrlPattern)
                      $runId = $detailsMatch.Groups['runId'].Value
                      $jobId = $detailsMatch.Groups['jobId'].Value
                      $run = gh api "repos/$env:GITHUB_REPOSITORY_NAME/actions/runs/$runId" | ConvertFrom-Json -Depth 20
                      if ($run.head_sha -ne $releaseCommitSha -or $run.workflow_id -ne $workflowIds[$requiredCheck.workflowFile]) {
                          continue
                      }

                      $jobsResponse = gh api "repos/$env:GITHUB_REPOSITORY_NAME/actions/runs/$runId/jobs?per_page=100" | ConvertFrom-Json -Depth 20
                      $job = $jobsResponse.jobs | Where-Object { $job.id -eq [Int64]$jobId -and $job.name -eq $requiredCheck.jobName }
                      if ($null -eq $job) {
                          continue
                      }

                      $trustedCheck = $check
                      break
                  }

                  if ($null -eq $trustedCheck) {
                      # Track untrusted same-name check but do not fail yet — wait for the
                      # trusted expected workflow/job check to appear before the deadline.
                      $incompleteChecks += "$($requiredCheck.checkName)=untrusted-provenance"
                      if (-not $untrustedSameName.ContainsKey($requiredCheck.checkName)) {
                          $untrustedSameName[$requiredCheck.checkName] = @($matchingChecks)
                      }
                  } elseif ($trustedCheck.status -ne 'completed') {
                      $incompleteChecks += "$($requiredCheck.checkName)=$($trustedCheck.status)"
                  } elseif ($trustedCheck.conclusion -ne 'success') {
                      $failedChecks += "$($requiredCheck.checkName)=$($trustedCheck.conclusion)"
                  }
              }

              if ($failedChecks.Count -gt 0) {
                  throw "Release is blocked because required CI checks are not green: $($failedChecks -join ', ')"
              }

              if ($incompleteChecks.Count -eq 0) {
                  Write-Host "All required CI checks succeeded for $releaseCommitSha."
                  break
              }

              if ((Get-Date) -ge $deadline) {
                  # At the deadline, fail with untrusted-provenance for any required checks
                  # that never received a trusted expected workflow/job match.
                  foreach ($untrustedName in $untrustedSameName.Keys) {
                      $failedChecks += "$untrustedName=untrusted-provenance"
                  }
                  if ($failedChecks.Count -gt 0) {
                      throw "Release is blocked because required CI checks did not complete within 30 minutes: $($incompleteChecks -join ', ')"
                  }
                  throw "Release is blocked because required CI checks did not complete within 30 minutes: $($incompleteChecks -join ', ')"
              }

              Write-Host "Waiting for required CI checks: $($incompleteChecks -join ', ')"
              Start-Sleep -Seconds 20
          } while ($true)

  prerelease:
    if: github.event_name == 'push'
    needs: [select-runner, verify-required-ci-checks]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve prerelease metadata
        id: release_info
        shell: pwsh
        run: |
          $info = & ./scripts/Get-SyncFactorsReleaseInfo.ps1 -Channel Prerelease -RunNumber $env:GITHUB_RUN_NUMBER -CommitSha $env:GITHUB_SHA
          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "assembly_informational_version=$($info.assemblyInformationalVersion)" >> $env:GITHUB_OUTPUT
          "tag=$($info.tag)" >> $env:GITHUB_OUTPUT
          "commit_sha=$($info.commitSha)" >> $env:GITHUB_OUTPUT

      - name: Publish applications
        shell: pwsh
        run: |
          dotnet publish ./src/SyncFactors.Api/SyncFactors.Api.csproj --configuration Release --runtime $env:SYNCFACTORS_RELEASE_RUNTIME --self-contained true --output ./artifacts/publish/api /p:Version="${{ steps.release_info.outputs.version }}" /p:InformationalVersion="${{ steps.release_info.outputs.assembly_informational_version }}" /p:SourceRevisionId="${{ steps.release_info.outputs.commit_sha }}"
          dotnet publish ./src/SyncFactors.Worker/SyncFactors.Worker.csproj --configuration Release --runtime $env:SYNCFACTORS_RELEASE_RUNTIME --self-contained true --output ./artifacts/publish/worker /p:Version="${{ steps.release_info.outputs.version }}" /p:InformationalVersion="${{ steps.release_info.outputs.assembly_informational_version }}" /p:SourceRevisionId="${{ steps.release_info.outputs.commit_sha }}"

      - name: Validate application versions
        shell: pwsh
        run: |
          ./scripts/Assert-SyncFactorsAssemblyVersion.ps1 -AssemblyPath ./artifacts/publish/api/SyncFactors.Api.dll -ExpectedInformationalVersion "${{ steps.release_info.outputs.assembly_informational_version }}" -ExpectedCommitSha "${{ steps.release_info.outputs.commit_sha }}"
          ./scripts/Assert-SyncFactorsAssemblyVersion.ps1 -AssemblyPath ./artifacts/publish/worker/SyncFactors.Worker.dll -ExpectedInformationalVersion "${{ steps.release_info.outputs.assembly_informational_version }}" -ExpectedCommitSha "${{ steps.release_info.outputs.commit_sha }}"

      - name: Build deployment bundle
        id: bundle
        shell: pwsh
        run: |
          New-Item -Path ./artifacts/releases -ItemType Directory -Force | Out-Null
          $bundlePath = Join-Path (Resolve-Path ./artifacts/releases) "syncfactors-${{ steps.release_info.outputs.version }}-$env:SYNCFACTORS_RELEASE_RUNTIME.zip"
          $bundle = & ./scripts/New-SyncFactorsReleaseBundle.ps1 -OutputPath $bundlePath -Version "${{ steps.release_info.outputs.version }}" -RuntimeIdentifier $env:SYNCFACTORS_RELEASE_RUNTIME -CommitSha "${{ steps.release_info.outputs.commit_sha }}"
          "bundle_path=$($bundle.bundlePath)" >> $env:GITHUB_OUTPUT

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.release_info.outputs.tag }}" "${{ steps.bundle.outputs.bundle_path }}" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.release_info.outputs.commit_sha }}" \
            --title "${{ steps.release_info.outputs.version }}" \
            --prerelease \
            --latest=false \
            --generate-notes

  stable-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [select-runner, verify-required-ci-checks]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      checks: read
      contents: write
    steps:
      - name: Check out target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target_ref }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Resolve stable release metadata
        id: release_info
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $commitSha = (git rev-parse HEAD).Trim()
          $info = & ./scripts/Get-SyncFactorsReleaseInfo.ps1 -Channel Stable -Version $env:RELEASE_VERSION -CommitSha $commitSha
          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "assembly_informational_version=$($info.assemblyInformationalVersion)" >> $env:GITHUB_OUTPUT
          "tag=$($info.tag)" >> $env:GITHUB_OUTPUT
          "commit_sha=$($info.commitSha)" >> $env:GITHUB_OUTPUT

      - name: Publish applications
        shell: pwsh
        run: |
          dotnet publish ./src/SyncFactors.Api/SyncFactors.Api.csproj --configuration Release --runtime $env:SYNCFACTORS_RELEASE_RUNTIME --self-contained true --output ./artifacts/publish/api /p:Version="${{ steps.release_info.outputs.version }}" /p:InformationalVersion="${{ steps.release_info.outputs.assembly_informational_version }}" /p:SourceRevisionId="${{ steps.release_info.outputs.commit_sha }}"
          dotnet publish ./src/SyncFactors.Worker/SyncFactors.Worker.csproj --configuration Release --runtime $env:SYNCFACTORS_RELEASE_RUNTIME --self-contained true --output ./artifacts/publish/worker /p:Version="${{ steps.release_info.outputs.version }}" /p:InformationalVersion="${{ steps.release_info.outputs.assembly_informational_version }}" /p:SourceRevisionId="${{ steps.release_info.outputs.commit_sha }}"

      - name: Validate application versions
        shell: pwsh
        run: |
          ./scripts/Assert-SyncFactorsAssemblyVersion.ps1 -AssemblyPath ./artifacts/publish/api/SyncFactors.Api.dll -ExpectedInformationalVersion "${{ steps.release_info.outputs.assembly_informational_version }}" -ExpectedCommitSha "${{ steps.release_info.outputs.commit_sha }}"
          ./scripts/Assert-SyncFactorsAssemblyVersion.ps1 -AssemblyPath ./artifacts/publish/worker/SyncFactors.Worker.dll -ExpectedInformationalVersion "${{ steps.release_info.outputs.assembly_informational_version }}" -ExpectedCommitSha "${{ steps.release_info.outputs.commit_sha }}"

      - name: Build deployment bundle
        id: bundle
        shell: pwsh
        run: |
          New-Item -Path ./artifacts/releases -ItemType Directory -Force | Out-Null
          $bundlePath = Join-Path (Resolve-Path ./artifacts/releases) "syncfactors-${{ steps.release_info.outputs.version }}-$env:SYNCFACTORS_RELEASE_RUNTIME.zip"
          $bundle = & ./scripts/New-SyncFactorsReleaseBundle.ps1 -OutputPath $bundlePath -Version "${{ steps.release_info.outputs.version }}" -RuntimeIdentifier $env:SYNCFACTORS_RELEASE_RUNTIME -CommitSha "${{ steps.release_info.outputs.commit_sha }}"
          "bundle_path=$($bundle.bundlePath)" >> $env:GITHUB_OUTPUT

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.release_info.outputs.tag }}" "${{ steps.bundle.outputs.bundle_path }}" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.release_info.outputs.commit_sha }}" \
            --title "${{ steps.release_info.outputs.version }}" \
            --generate-notes
